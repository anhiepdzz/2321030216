<html>  
    <head>  
        <tile> Bai 3</tile>
    </head>
    <body>  
        <!-- ol danh sach co thu tu -->
         <ol>   
            <li>    C#</li>
            <li> Pyhton </li>
            <li> java   </li>
         </ol>
         <!-- ul danh sach ko thu tu -->
          <ul>  
            <li>    C#</li>
            <li> Pyhton </li>
            <li> java   </li>
          </ul>
        <!-- form  -->
         <hl>Form đăng ký   </hl>
         <form> 
            <div>   <b> Họ và tên</b><br>
                <input type="text" placeholder="Họ và tên"><br>
            </div>
            <div>
                <b>Tài khoản</b><br>
                <input type="text" placeholder="Tài khoản">
                <!-- Nếu input ko có type sẽ mặc định là text -->
            </div>
            <div>   
                <b> Mật khẩu    </b> <br>
                <input type="password" placeholder="Mật khẩu">
                <!-- Thuộc tính readonly sử dụng khi không muốn ng dùng nhập thông tin vào input -->
            </div>
            <div>   
                <b>Năm sinh </b><br>
                <input type="number" placeholder="Năm sinh"
            </div>
            <div>   
                <b> Giới thiệu về bản thân</b><br>
                <textarea>Nhập thông tin ...</textarea>
            </div>
            <div>   
                <b> Email   </b> <br>
                <input type="email">
            </div> 
            <div>   
                <!-- số đầu tiên : 0 -->
                <!-- số thứ 2 9 8  -->
                <!-- 8 số còn lại 0 đến 9 -->
                <b>Số điện thoại</b><br>
                <input type="tel" pattern="([0]{1}([3,8,9]{1})([0,9]{8}))">
            </div>
            <div>   
                <b>Giới tính</b><br>
                <input type="radio" name="gioitinh" value="nam">Nam<br>
                <input type="radio" name="gioitinh" value="nu">Nữ
            </div>
            <div>   
                <b>Sở thích</b><br>
                Chơi game:<input type="checkbox" name="sothich" value="gamer"><br>
                Nghe nhạc:<input type="checkbox" name="sothich" value="music"><br>
                Thể thao:<input type="checkbox" name="sothich" value="thethao"><br>
            </div>
            <div>   
                <b>Trình duyệt web yêu thích</b><br>
                <select name="browsers">
                    <option value="CocCoc">Cốc Cốc</option>
                    <option value="Chorme">Chrome</option>
                </select>
            </div>
            <!-- input type = range id =a value50>100 -->
            <div>
                <input type="submit">
            </div> 
            </div>
         </form>
    </body>
</html>
