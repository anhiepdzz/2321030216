<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bài 10</title>
    <style>
        main{
            display: flex;

        }
        .trai{
            width: 75%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .phai{
            width: 25%;
            height: 500px;
            background-color: red;
            text-align: center;
        }
        .video{
            width: 90%;
            height: 400px;
            background-color: black;
            border-radius: 20px;
        }
        h1{
            text-align: center;
        }
        .bai-hat{
            width: 95%;
            height: 80px;
            margin: auto;
            background-color: antiquewhite;
            display: flex;
            align-items: center;
        }
        img{
            width: 25%;
            margin-right: 10px;
        }
        p{
            width: 75px;
        }
    </style>
</head>
<body>
    <main>
        <div class="trai">
            <div class="video">

            </div>
        </div>
        <div class="phai">
            <h1>Danh Sách</h1>
            <div class="danh-sach">
                <div class="bai-hat">
                    <img class="anh-bai" src="mattrang.png" alt="">
                    <p>tên bài hát</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
